version: 2
updates:
  - package-ecosystem: docker
    directory: /patterns/mqtt-to-dbus
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /patterns/mqtt-to-dbus
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep CodeQL components and shared workflow pins in one reviewed update.
      ci-workflows:
        applies-to: version-updates
        patterns:
          - "*"
